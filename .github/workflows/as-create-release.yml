name: AS Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in v<versionName>+<versionCode> format
        required: true
        default: v1.2.0+12
      title:
        description: Release title
        required: true
        default: AS-KharjYar 1.2.0

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}\+[0-9]+$ ]]; then
            echo "Invalid AS-KharjYar release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES.md
