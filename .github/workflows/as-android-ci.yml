name: AS Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: as-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        id: lint
        continue-on-error: true
        run: ./gradlew lintRelease --stacktrace

      - name: Print lint report
        if: always()
        shell: bash
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt"
          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AS-KharjYar-lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      - name: Enforce lint quality gate
        if: steps.lint.outcome != 'success'
        run: exit 1

      - name: Build debug, release APK and release AAB
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Package exact source snapshot
        shell: bash
        run: git archive --format=zip --output=AS-KharjYar-source.zip HEAD

      - name: Upload Android artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AS-KharjYar-android-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            AS-KharjYar-source.zip
          if-no-files-found: error
