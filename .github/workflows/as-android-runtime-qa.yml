name: AS Android Runtime QA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: as-android-runtime-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-upgrade-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Download known-good previous APK artifact
        uses: actions/download-artifact@v4
        with:
          name: AS-KharjYar-apks
          path: previous-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33642951110

      - name: Build current debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Re-sign previous and current debug APKs with one QA key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/qa-upgrade.jks" \
            -storepass qa-upgrade-pass \
            -keypass qa-upgrade-pass \
            -alias qa-upgrade \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=AS KharjYar QA,O=AS Team,C=CA"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          PREVIOUS_APK="$(find previous-artifact -type f -name 'app-debug.apk' | head -n 1)"
          CURRENT_APK="app/build/outputs/apk/debug/app-debug.apk"

          test -n "$APKSIGNER"
          test -f "$PREVIOUS_APK"
          test -f "$CURRENT_APK"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/qa-upgrade.jks" \
            --ks-pass pass:qa-upgrade-pass \
            --key-pass pass:qa-upgrade-pass \
            --ks-key-alias qa-upgrade \
            --out "$RUNNER_TEMP/previous-debug.apk" \
            "$PREVIOUS_APK"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/qa-upgrade.jks" \
            --ks-pass pass:qa-upgrade-pass \
            --key-pass pass:qa-upgrade-pass \
            --ks-key-alias qa-upgrade \
            --out "$RUNNER_TEMP/current-debug.apk" \
            "$CURRENT_APK"

          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/previous-debug.apk"
          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/current-debug.apk"

      - name: Emulator install, upgrade, persistence and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            PACKAGE="com.asteam.kharjyar.debug"
            PREVIOUS_APK="$RUNNER_TEMP/previous-debug.apk"
            CURRENT_APK="$RUNNER_TEMP/current-debug.apk"

            adb install "$PREVIOUS_APK"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 5

            adb shell run-as "$PACKAGE" sh -c 'echo as-kharjyar-upgrade-sentinel > files/upgrade-sentinel'
            BEFORE="$(adb shell run-as "$PACKAGE" cat files/upgrade-sentinel | tr -d '\r')"
            test "$BEFORE" = "as-kharjyar-upgrade-sentinel"

            adb install -r "$CURRENT_APK"
            AFTER="$(adb shell run-as "$PACKAGE" cat files/upgrade-sentinel | tr -d '\r')"
            test "$AFTER" = "as-kharjyar-upgrade-sentinel"

            adb logcat -c
            adb shell am force-stop "$PACKAGE"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 8

            PID="$(adb shell pidof -s "$PACKAGE" | tr -d '\r')"
            test -n "$PID"

            if adb logcat -d -b crash | grep -F "$PACKAGE"; then
              echo "Crash detected after upgrade" >&2
              exit 1
            fi

            echo "Upgrade persistence and launch smoke test passed."
