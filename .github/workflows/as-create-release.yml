name: AS Create Release

on:
  workflow_run:
    workflows:
      - AS Android CI
      - AS Android Runtime QA
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  create-release:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Require both validation workflows on the same commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          QUALITY="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" --jq '[.workflow_runs[] | select(.name == "AS Android CI" and .status == "completed")][0].conclusion // "missing"')"
          RUNTIME="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" --jq '[.workflow_runs[] | select(.name == "AS Android Runtime QA" and .status == "completed")][0].conclusion // "missing"')"
          echo "Quality CI: $QUALITY"
          echo "Runtime QA: $RUNTIME"
          test "$QUALITY" = "success"
          test "$RUNTIME" = "success"

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version_code=12$' gradle.properties
          grep -q '^version_name=1.2.0$' gradle.properties
          grep -q '^application_id=com.asteam.kharjyar$' gradle.properties

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.2.0+12
          RELEASE_TITLE: AS-KharjYar 1.2.0
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            EXISTING_TARGET="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish')"
            echo "Release $RELEASE_TAG already exists for $EXISTING_TARGET."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "$HEAD_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES.md
